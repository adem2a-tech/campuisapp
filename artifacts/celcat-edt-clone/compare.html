<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Comparaison Original vs Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Arial, sans-serif; background: #222; color: #fff; }
    h1 { font-size: 14px; padding: 8px 12px; background: #111; }
    .row { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 36px); }
    .pane { display: flex; flex-direction: column; border-right: 2px solid #000; }
    .pane h2 { font-size: 12px; padding: 6px 10px; background: #333; }
    .pane img, .pane iframe { flex: 1; width: 100%; border: 0; background: #fff; object-fit: contain; object-position: top; }
  </style>
</head>
<body>
  <h1>Gauche = capture originale · Droite = clone (localhost:5180)</h1>
  <div class="row">
    <div class="pane">
      <h2>ORIGINAL (ta capture)</h2>
      <img src="original.png" alt="Original Celcat" />
    </div>
    <div class="pane">
      <h2>CLONE</h2>
      <iframe src="/" title="Clone"></iframe>
    </div>
  </div>
</body>
</html>
